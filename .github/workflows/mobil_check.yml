name: TR Mobil Kontrol (SOAX)

# Sadece mobil (Turkcell/Vodafone) olcum. Globalping kullanmaz, ana kontrolun limitini
# ve durumunu etkilemez. Mesajlar "SOAX'a gore ... bilgi" olarak gelir.
on:
  schedule:
    - cron: '7,17,27,37,47,57 4-20 * * *'   # 10 dk'da bir; UTC 21:00-03:59 (TR 00:00-06:59) arasi calismaz
  workflow_dispatch:

permissions:
  contents: write             # durum dalini (durum-mobil) yayinlamak icin

concurrency:
  group: mobil-kontrol
  cancel-in-progress: false

jobs:
  mobil:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Ana kontrolun durumundan ayri tutulur (karismasin diye).
      - name: Onceki mobil durumu getir
        uses: actions/cache/restore@v4
        with:
          path: domain_state_mobil.json
          key: mobil-state-${{ github.run_id }}
          restore-keys: |
            mobil-state-

      - name: Mobil kontrol
        env:
          DOMAIN_LIST: ${{ vars.DOMAIN_LIST }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          MOBILE_PROXY_PASSWORD: ${{ secrets.MOBILE_PROXY_PASSWORD }}
          MOBILE_ISPS: ${{ vars.MOBILE_ISPS }}
        run: python domain_check.py --sadece-mobil --notify --state domain_state_mobil.json --out mobil_status.json

      - name: Durumu kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: domain_state_mobil.json
          key: mobil-state-${{ github.run_id }}

      # Panel icin son sonucu "durum-mobil" dalina tek commit olarak yazar (main'e dokunmaz).
      - name: Paneli guncelle
        continue-on-error: true
        if: always()
        run: |
          if [ -f mobil_status.json ]; then
            rm -rf /tmp/pub && mkdir /tmp/pub && cp mobil_status.json /tmp/pub/
            cd /tmp/pub
            git init -q -b durum-mobil
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobil_status.json
            git commit -q -m "durum $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/durum-mobil
          fi
