name: TR Erisim Kontrolu

on:
  schedule:
    - cron: '4,19,34,49 4-20 * * *'   # 15 dk'da bir; UTC 21:00-03:59 (TR 00:00-06:59) arasi calismaz
  workflow_dispatch:          # elle de calistirilabilir

permissions:
  contents: write             # durum dalini (durum-ana) yayinlamak icin

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Onceki durum (ENGELLI/ACIK...) commit edilmez, cache'te tutulur.
      # Boylece sadece durum degisince Telegram'a mesaj gider.
      - name: Onceki durumu getir
        uses: actions/cache/restore@v4
        with:
          path: domain_state.json
          key: domain-state-${{ github.run_id }}
          restore-keys: |
            domain-state-

      - name: Kontrol
        env:
          GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
          DOMAIN_LIST: ${{ vars.DOMAIN_LIST }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          # Mobil (SOAX) olcum ayri is: mobil_check.yml (10 dakikada bir)
        run: python domain_check.py --notify --state domain_state.json --out domain_status.json
        # Cikis 2 sadece YENI bir engel cikinca doner (is kirmizi olur),
        # 3 = Globalping API/limit hatasi.

      - name: Durumu kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: domain_state.json
          key: domain-state-${{ github.run_id }}

      # Panel icin son sonucu "durum-ana" dalina tek commit olarak yazar (main'e dokunmaz).
      - name: Paneli guncelle
        continue-on-error: true
        if: always()
        run: |
          if [ -f domain_status.json ]; then
            rm -rf /tmp/pub && mkdir /tmp/pub && cp domain_status.json /tmp/pub/
            cd /tmp/pub
            git init -q -b durum-ana
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add domain_status.json
            git commit -q -m "durum $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/durum-ana
          fi
