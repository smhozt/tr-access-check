name: BTK Sorgu Testi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  btk:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: BTKSorgu kur
        run: pip install BTKSorgu

      - name: Sorgula (direkt ve SOAX Turkcell uzerinden)
        env:
          MOBILE_PROXY_PASSWORD: ${{ secrets.MOBILE_PROXY_PASSWORD }}
        run: |
          python -u - <<'EOF'
          import os, urllib.parse
          import requests

          # BTKSorgu zaman asimi koymuyor: her istege 20 sn sinir ekle
          _orig = requests.sessions.Session.request
          def _req(self, *a, **k):
              k.setdefault("timeout", 20)
              return _orig(self, *a, **k)
          requests.sessions.Session.request = _req

          from BTKSorgu import BTKSorgu

          # redtube.com = paketin kendi ornegi, engelli oldugu bilinen kontrol domaini
          DOMAINS = ["redtube.com", "betsat1856.com", "betsat1855.com",
                     "superbetin2916.com", "786turkbet.com"]

          def run(title):
              print("=== " + title, flush=True)
              for d in DOMAINS:
                  try:
                      print(d, "->", str(BTKSorgu(d))[:300], flush=True)
                  except Exception as e:
                      print(d, "-> HATA:", type(e).__name__, str(e)[:200], flush=True)

          run("DIREKT (GitHub, yurt disi)")

          pw = os.environ.get("MOBILE_PROXY_PASSWORD", "").strip()
          if pw:
              user = "country-tr-isp-turkcell-network-mob"
              proxy = "http://%s:%s@proxy.soax.com:1337" % (
                  urllib.parse.quote(user, safe="-_"), urllib.parse.quote(pw, safe=""))
              os.environ["HTTPS_PROXY"] = proxy
              os.environ["HTTP_PROXY"] = proxy
              run("SOAX TURKCELL PROXY (Turkiye cikisi)")
          else:
              print("MOBILE_PROXY_PASSWORD yok, proxy testi atlandi", flush=True)
          EOF
